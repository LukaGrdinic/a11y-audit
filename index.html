                  class="nav-link"
                  href="#ourVeterinarians"

              </li>
              <li class="nav-item">

                  id="header_link_happy_customers"

    <main class="container" style="margin-top: 40px">
      <section class="row">
        <div class="col-12">

            <i role="presentation" class="fa-solid fa-paw fa-2x"></i>
            <span id="paws_and_claws_wet" class="d-block mt-3"></span>
          </h1>
        </div>
      </section>
      <section id="introduction" class="row">
        <div class="col-md-8 mx-auto text-center">
          <h2 id="welcome_to_our_veterinary_services" class="my-3"></h2>
          <p id="at_paws_and_claws_vet"></p>
        </div>
      </section>
      <section id="whyUs" class="row mt-5">
        <div

        >
          <h2 id="why_choose_us" class="my-3"></h2>
          <p id="with_a_commitment_to_excellence"></p>
          <p id="our_clinic_stands_out"></p>
          <p id="we_believe_in_open_communication"></p>
        </div>
        <div class="col-md-6 text-center">
          <div>
            <img
              src="images/dog-wrapped-in-blanket-in-forest.jpg"
              alt=""
              class="img-fluid rounded-3"
              id="dog_wrapped_in_blanket_in_forest"
            />
          </div>
        </div>
      </section>
      <section id="ourVeterinarians" class="row mt-5">
        <div
          class="col-md-6 order-1 order-md-0 mt-3 mt-md-0 text-center text-md-start"
        >
          <h2 id="our_expert_veterinarians" class="my-3"></h2>
          <p id="meet_our_team">
          </p>
          <p id="our_team_of_vets_goes_beyond">
          </p>
          <p id="from_the_moment_you_step_into">
            
          </p>
        </div>
        <div class="col-md-6 text-center">
          <img

            alt=""
            class="img-fluid rounded-3"

          />
        </div>
      </section>
      <section id="happyCustomers" class="row mt-5">
        <div class="col-md-12 text-center">
          <div class="row">
            <div class="col-md-8 mx-auto">
              <h2 id="hundreds_of_happy_customers" class="my-3"></h2>
              <p id="explore_the_gallery">
              </p>
            </div>
          </div>
          <div class="row mt-4">
            <div class="col-md-4">
              <img
                class="max-h-275px img-fit-cover w-100 mb-3 rounded-3"
                src="images/cat-gray-tiger.jpg"
                alt=""
                id="cat_gray_tiger"
              />
            </div>
            <div class="col-md-4">
              <img
                class="max-h-275px img-fit-cover w-100 mb-3 rounded-3"
                src="images/dog-smiling-in-lavender.jpg"
                alt=""
                id="dog_smiling_in_lavender"
              />
            </div>
            <div class="col-md-4">
              <img
                class="max-h-275px img-fit-cover w-100 mb-3 rounded-3"
                src="images/cat-gray-and-dog-black-on-table.jpg"
                alt=""
                id="cat_gray_and_dog_black_on_table"
              />
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <img
                class="max-h-275px img-fit-cover w-100 mb-3 rounded-3"
                src="images/dogs-puppies-several.jpg"
                alt=""
                id="dogs_puppies_several"
              />
            </div>
            <div class="col-md-4">
              <img
                class="max-h-275px img-fit-cover w-100 mb-3 rounded-3"
                src="images/dog-in-a-sweatshirt.jpg"
                alt=""
                id="dog_in_a_sweatshirt"
              />
            </div>
            <div class="col-md-4">
              <img
                class="max-h-275px img-fit-cover w-100 mb-3 rounded-3"
                src="images/cat-white-and-orange.jpg"
                alt=""
                id="cat_white_and_orange"
              />
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <img
                class="max-h-275px img-fit-cover w-100 mb-3 rounded-3"
                src="images/cat-green-eyes-and-dog-white-and-black.jpg"
                alt=""
                id="cat_green_eyes_and_dog_white_and_black"
              />
            </div>
            <div class="col-md-4">
              <img
                class="max-h-275px img-fit-cover w-100 mb-3 rounded-3"
                src="images/dogs-two-running-with-tongues-out.jpg"
                alt=""
                id="dogs_two_running_with_tongues_out"
              />
            </div>
            <div class="col-md-4">
              <img
                class="max-h-275px img-fit-cover w-100 mb-3 rounded-3"
                src="images/dog-black-white-and-brown.jpg"
                alt=""
                id="dog_black_white_and_brown"
              />
            </div>
          </div>
        </div>
      </section>
      <section id="appointmentForm" class="row mt-5">
        <div class="col-lg-8 mx-auto">
          <div class="card">
            <div class="card-body px-sm-5">
              <div class="d-flex align-items-center mt-3 mb-4">
                <span class="pe-3"
                  ><i class="fa-regular fa-calendar-check fa-2x"></i
                ></span>
                <h2 id="make_an_appointment_form_heading" class="mb-0">
                </h2>
              </div>
              <form
                action="#"
                method="post"
                aria-labelledby="make_an_appointment_form_heading"
              >
                <!-- Field 1: Pet's Name (Text Input) -->
                <div class="mb-3">
                  <label id="pet_name_label" for="petName"></label>
                  <input
                    class="form-control"
                    type="text"
                    id="petName"
                    name="petName"
                    required
                  />
                </div>
                <!-- Field 2: Pet Type (Radio Buttons) -->
                <div class="mb-3">
                  <fieldset>
                    <legend id="pet_type_legend"></legend>
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        id="dog"
                        name="petType"
                        value="dog"
                        required
                      />
                      <label id="dog_label" class="form-check-label" for="dog"></label>
                    </div>
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        id="cat"
                        name="petType"
                        value="cat"
                        required
                      />
                      <label id="cat_label" class="form-check-label" for="cat"></label>
                    </div>
                  </fieldset>
                </div>
                <!-- Field 3: Appointment Type (Checkbox) -->
                <div class="mb-3">
                  <fieldset>
                    <legend id="appointment_type_legend"></legend>
                    <div class="form-check ps-0">
                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          id="checkup"
                          name="appointmentType[]"
                          value="checkup"
                        />
                        <label id="checkup_label" class="form-check-label" for="checkup"
                          ></label
                        >
                      </div>
                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          id="vaccination"
                          name="appointmentType[]"
                          value="vaccination"
                        />
                        <label id="vaccination_label" class="form-check-label" for="vaccination"
                          ></label
                        >
                      </div>
                    </div>
                  </fieldset>
                </div>
                <!-- Field 4: Preferred day of next week: (Dropdown/Select) -->
                <div class="mb-3">
                  <label id="preffered_day_label" for="preferredDay"></label>
                  <select
                    class="form-select"
                    id="preferredDay"
                    name="preferredDay"
                    required
                  >
                    <option id="monday" selected value="monday"></option>
                    <option id="tuesday" value="tuesday"></option>
                    <option id="wednesday" value="wednesday"></option>
                    <option id="thursday" value="thursday"></option>
                    <option id="friday" value="friday"></option>
                    <option id="saturday" value="saturday"></option>
                    <option id="sunday" value="sunday"></option>
                  </select>
                </div>
                <!-- Field 5: Owner's Name (Text Input) -->
                <div class="mb-3">
                  <label id="owner_name_label" for="ownerName"></label>
                  <input
                    class="form-control"
                    type="text"
                    id="ownerName"
                    name="ownerName"
                    required
                  />
                </div>
                <!-- Field 8: Email (Email Input) -->
                <div class="mb-3">
                  <label id="email_label" for="email"></label>
                  <input
                    class="form-control"
                    type="email"
                    id="email"
                    name="email"
                    required
                  />
                </div>
                <!-- Submit Button -->
                <button
                  class="btn btn-primary"
                  id="submit_btn"
                  type="submit"
                  value="Submit"
                >
                </button>
              </form>
              <div id="submit_alert" class="d-none" role="alert"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="bg-light">
      <div
        class="container d-flex flex-column flex-sm-row justify-content-between align-items-center mt-5 py-3"
      >
        <p class="mb-0">&copy; <span id="copyright"></span></p>
        <div>
          <a class="text-dark fs-4 me-1" aria-label="Facebook" href="#"
            ><i class="fa-brands fa-facebook"></i
          ></a>
          <a class="text-dark fs-4" aria-label="Instagram" href="#"
            ><i class="fa-brands fa-instagram"></i
          ></a>
        </div>
      </div>
    </footer>

    <dialog
      id="confirmationDialog"
      aria-labelledby="dialog_title"
      aria-describedby="dialog_description"
    >
      <h3 id="dialog_title"></h3>
      <p id="dialog_description">
        
      </p>
      <button id="cancelButton" type="button" class="btn btn-secondary">
        Cancel
      </button>
      <button id="okButton" type="button" class="btn btn-primary">OK</button>
    </dialog>

    <script>
      const dialog = document.getElementById("confirmationDialog");
      const okButton = document.getElementById("okButton");
      const cancelButton = document.getElementById("cancelButton");
      const form = document.querySelector("form");
      const submit_alert = document.getElementById("submit_alert");

      const focusableElements =
        'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
      const firstFocusableElementInDialog =
        dialog.querySelectorAll(focusableElements)[0];
      const lastFocusableElementInDialog =
        dialog.querySelectorAll(focusableElements)[
          dialog.querySelectorAll(focusableElements).length - 1
        ];

      firstFocusableElementInDialog.addEventListener("keydown", function (e) {
        if (e.key === "Tab" && e.shiftKey) {
          e.preventDefault();
          lastFocusableElementInDialog.focus();
        }
      });

      lastFocusableElementInDialog.addEventListener("keydown", function (e) {
        if (e.key === "Tab" && !e.shiftKey) {
          e.preventDefault();
          firstFocusableElementInDialog.focus();
        }
      });

      form.addEventListener("submit", function (event) {
        // Prevent the form from submitting
        event.preventDefault();

        // Show the dialog
        dialog.showModal();
      });

      okButton.addEventListener("click", function () {
        // If the user clicks OK, close the dialog and manually submit the form
        dialog.close();
        // form.submit();

        // Show an alert after the form is submitted
        form.classList.add("d-none");
        submit_alert.classList.remove("d-none");
      });

      cancelButton.addEventListener("click", function () {
        // If the user clicks Cancel, close the dialog and reset the preferred time field
        dialog.close();
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>

    <!-- Internationalization -->
    <script>
      let language = localStorage.getItem("language") || "en";
      const languageSelection = document.getElementById("languageSelection");
      languageSelection.value = language;
      languageSelection.addEventListener("change", function (ev) {
        localStorage.setItem("language", ev.target.value);
        location.reload();
      });

      fetch(`i18n/${language}.json`)
        .then((response) => response.json())
        .then((translations) => {
          setTranslations(translations);
        });

      function setTranslation(id, translations) {
        const element = document.getElementById(id);
        if (element) {
          element.textContent = translations[id];
        }
      }

      function setAltTextTranslation(id, translations) {
        const element = document.getElementById(id);
        if (element) {
          element.alt = translations[id];
        }
      }
      function setTranslations(translations) {
        const elementsToTranslate = [
          "language_selection_label",
          "header_link_why_us",
          "header_link_our_veterinarians",
          "header_link_happy_customers",
          "header_link_make_an_appointment",
          "paws_and_claws_wet",
          "welcome_to_our_veterinary_services",
          "at_paws_and_claws_vet",
          "why_choose_us",
          "with_a_commitment_to_excellence",
          "our_clinic_stands_out",
          "we_believe_in_open_communication",
          "our_expert_veterinarians",
          "meet_our_team",
          "our_team_of_vets_goes_beyond",
          "from_the_moment_you_step_into",
          "hundreds_of_happy_customers",
          "explore_the_gallery",
          "make_an_appointment_form_heading",
          "pet_name_label",
          "pet_type_legend",
          "dog_label",
          "cat_label",
          "appointment_type_legend",
          "checkup_label",
          "vaccination_label",
          "preffered_day_label",
          "owner_name_label",
          "email_label",
          "monday",
          "tuesday",
          "wednesday",
          "thursday",
          "friday",
          "saturday",
          "sunday",
          "submit_btn",
          "copyright",
          "dialog_title",
          "dialog_description",
          "submit_alert"
        ];
        const elementsToTranslateAltText = [
          "cat_gray_tiger",
          "dog_smiling_in_lavender",
          "cat_gray_and_dog_black_on_table",
          "dogs_puppies_several",
          "dog_in_a_sweatshirt",
          "cat_white_and_orange",
          "cat_green_eyes_and_dog_white_and_black",
          "dogs_two_running_with_tongues_out",
          "dog_black_white_and_brown",
          "dog_wrapped_in_blanket_in_forest",
          "tough_guy_with_a_cat"
        ];
        elementsToTranslate.forEach((id) => setTranslation(id, translations));
        elementsToTranslateAltText.forEach((id) => setAltTextTranslation(id, translations));
      }
    </script>
  </body>
</html>
